<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Active Directory and SOC home lab planned network topology</title>
<desc id="desc">A 192.168.10.0/24 network with a Windows domain controller, Splunk server, Windows 11 client and Kali Linux test workstation, connected through a logical virtual network to a logical router and Internet.</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#26313b" stroke-width=".6"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#a8c5d7" stroke-width="1.2"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e8f0f6}.heading{font-size:21px;font-weight:bold}.label{font-size:15px;font-weight:bold}.detail{font-size:12.5px}.muted{fill:#a7bbca}.host{fill:#17232d;stroke:#7ebadc;stroke-width:2}.link{stroke:#9cb1c0;stroke-width:2;fill:none}.blue{fill:#76c7ed}.pink{fill:#f0a0c1}</style>
</defs>
<rect width="960" height="650" fill="#10161b"/><rect width="960" height="650" fill="url(#grid)"/>
<text class="heading" x="40" y="40">Active Directory + SOC Home Lab</text>
<text class="detail muted" x="40" y="63">DESIGN ONLY • Oracle VirtualBox • Network 192.168.10.0/24 • Domain label: MyDFIR</text>
<!-- network backbone -->
<path class="link" d="M480 166V254" marker-end="url(#arrow)"/>
<path class="link" d="M480 305V352"/>
<path class="link" d="M320 375H410M550 375H670M480 399V460" />
<path class="link" d="M320 375V365H290M320 375V510H290" />
<rect class="host" x="418" y="352" rx="10" width="124" height="48"/>
<text x="480" y="373" class="label" text-anchor="middle">VIRTUAL</text><text x="480" y="389" class="detail" text-anchor="middle">NETWORK</text>
<!-- Internet -->
<rect class="host" x="393" y="104" rx="30" width="174" height="62"/>
<text class="label" x="480" y="132" text-anchor="middle">Internet</text><text class="detail muted" x="480" y="148" text-anchor="middle">(logical path)</text>
<rect class="host" x="425" y="254" width="110" height="51" rx="24"/>
<text class="label" x="480" y="275" text-anchor="middle">Router</text><text class="detail muted" x="480" y="291" text-anchor="middle">logical</text>
<!-- Splunk -->
<rect class="host" x="42" y="298" width="248" height="132" rx="10"/>
<rect x="63" y="319" width="27" height="47" rx="2" fill="none" stroke="#7ebadc" stroke-width="3"/><path d="M69 328h15M69 336h15M69 344h15" stroke="#7ebadc" stroke-width="2"/>
<text class="label" x="108" y="328">Splunk Server</text>
<text class="detail" x="108" y="350">192.168.10.10</text>
<text class="detail muted" x="63" y="392">Central event collection</text>
<text class="detail muted" x="63" y="411">Search and investigation</text>
<!-- AD -->
<rect class="host" x="42" y="453" width="248" height="155" rx="10"/>
<rect x="63" y="473" width="27" height="47" rx="2" fill="none" stroke="#7ebadc" stroke-width="3"/><path d="M69 483h15M69 491h15M69 499h15" stroke="#7ebadc" stroke-width="2"/>
<text class="label" x="108" y="486">Active Directory</text>
<text class="detail" x="108" y="507">192.168.10.7</text>
<text class="detail muted" x="63" y="541">Domain Controller / DNS</text><text class="detail muted" x="63" y="561">Splunk Universal Forwarder</text><text class="detail muted" x="63" y="581">Sysmon (planned)</text>
<!-- Kali -->
<rect class="host" x="670" y="298" width="248" height="132" rx="10"/>
<rect x="686" y="321" width="45" height="29" rx="2" fill="none" stroke="#f0a0c1" stroke-width="3"/><path d="M708 350v9m-16 0h32" stroke="#f0a0c1" stroke-width="3"/>
<text class="label" x="747" y="330">Kali Linux</text><text class="detail" x="747" y="351">192.168.10.250</text>
<text class="detail muted" x="686" y="393">Authorised lab testing</text>
<!-- Windows -->
<rect class="host" x="351" y="460" width="258" height="148" rx="10"/>
<rect x="367" y="480" width="46" height="29" rx="2" fill="none" stroke="#76c7ed" stroke-width="3"/><path d="M390 510v8m-15 0h30" stroke="#76c7ed" stroke-width="3"/>
<text class="label" x="426" y="491">Windows 11</text><text class="detail" x="426" y="513">IP: DHCP</text>
<text class="detail muted" x="367" y="542">Splunk Universal Forwarder</text><text class="detail muted" x="367" y="562">Sysmon</text><text class="detail muted" x="367" y="582">Atomic Red Team (planned)</text>
<text class="detail muted" x="40" y="635">Lines indicate intended logical connectivity; deployment and connectivity tests are pending.</text>
